<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Kerkrit Kochdruang</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d0d0d;--paper:#f5f0e8;--cream:#ede8dc;
  --red:#e94040;--gold:#c8a94a;--muted:#6b6560;
  --border:rgba(13,13,13,0.11);--nav-w:224px;
  --topbar-h:54px;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans','Sarabun',sans-serif;
  --display:'Bebas Neue',sans-serif;
}
html{scroll-behavior:auto;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;height:100%}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

/* ── NAV BACKDROP (mobile) ── */
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(13,13,13,.55);z-index:350;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav-backdrop.show{display:block}

/* ── TOPBAR mobile ── */
.topbar{display:none;position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--ink);align-items:center;justify-content:space-between;padding:0 16px;z-index:400;border-bottom:2px solid var(--red)}
.topbar-name{font-family:var(--display);font-size:18px;color:var(--paper);letter-spacing:2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.burger{background:none;border:none;cursor:pointer;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.burger span{display:block;width:22px;height:2px;background:var(--paper);transition:all .25s;border-radius:2px}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ── SIDENAV ── */
.sidenav{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:var(--ink);display:flex;flex-direction:column;padding:44px 0 28px;z-index:380;border-right:3px solid var(--red);transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto;overscroll-behavior:contain;}
.sidenav-logo{padding:0 26px;margin-bottom:36px}
.sidenav-name{font-family:var(--display);font-size:25px;letter-spacing:2px;color:var(--paper);line-height:1.05}
.sidenav-sub{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-top:4px}
.nav-links{list-style:none;flex:1;overflow-y:auto}
.nav-section-label{padding:18px 26px 6px;font-family:var(--mono);font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(245,240,232,.18);display:block;cursor:default;pointer-events:none;user-select:none;list-style:none;}
.nav-links li a{display:flex;align-items:center;gap:10px;padding:10px 26px;color:rgba(245,240,232,.42);text-decoration:none;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;border-left:3px solid transparent;cursor:pointer}
.nav-links li a:hover{color:rgba(245,240,232,.8);background:rgba(255,255,255,.04)}
.nav-links li a.active{color:var(--paper);border-left-color:var(--red);background:rgba(233,64,64,.08)}
.nav-links li a .nicon{font-size:13px;width:18px;text-align:center}
.lang-toggle{margin:0 26px 20px;display:flex;gap:0;border:1px solid rgba(245,240,232,.15);border-radius:3px;overflow:hidden}
.lang-btn{flex:1;padding:7px 4px;font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(245,240,232,.35);background:none;border:none;cursor:pointer;transition:all .2s;}
.lang-btn.on{background:var(--red);color:white}
.sidenav-foot{padding:16px 26px 0;font-family:var(--mono);font-size:9px;color:rgba(245,240,232,.22);line-height:1.9;border-top:1px solid rgba(255,255,255,.06)}

/* ── APP ── */
.app{margin-left:var(--nav-w);height:100vh;position:relative;overflow:hidden}
.page{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;padding:70px 68px 88px;opacity:0;transform:translateX(28px);pointer-events:none;transition:opacity .38s cubic-bezier(.16,1,.3,1),transform .38s cubic-bezier(.16,1,.3,1);will-change:opacity,transform;visibility:hidden;}
.page.active{opacity:1;transform:none;pointer-events:all;visibility:visible}
.page.exit{opacity:0;transform:translateX(-28px);visibility:hidden}

@media(max-width:960px){
  .app{margin-left:0;height:100vh}
  .page{top:var(--topbar-h);bottom:0;left:0;right:0;padding:20px 20px 80px;-webkit-overflow-scrolling:touch;touch-action:pan-y;visibility:hidden;}
  .page.active{visibility:visible}
}

.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;max-width:52px;height:1px;background:var(--red)}
h2.sec-title{font-family:var(--display);font-size:clamp(36px,5.5vw,68px);letter-spacing:2px;color:var(--ink);line-height:1;margin-bottom:44px}
.section-divider{border:none;border-top:1px solid var(--border);margin:72px 0}
@media(max-width:960px){.section-divider{margin:40px 0}}

/* ── PAGES ── */
#page-home{background:var(--paper)}
.hero{min-height:calc(100vh - 200px);max-height:100vh;display:flex;flex-direction:column;justify-content:center;margin-bottom:16px}
@media(max-width:960px){.hero{min-height:auto;max-height:none;padding-top:16px;padding-bottom:8px}}
.hero-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:18px;display:flex;align-items:center;gap:12px}
.hero-eyebrow::before{content:'';width:32px;height:1px;background:var(--red)}
h1.hero-name{font-family:var(--display);font-size:clamp(60px,9.5vw,116px);line-height:.9;letter-spacing:3px;color:var(--ink);margin-bottom:10px}
h1.hero-name em{display:block;color:var(--red);font-style:normal}
.hero-bio{max-width:480px;font-size:15px;color:var(--muted);line-height:1.85;margin:26px 0 18px}
.expertise-list{list-style:none;padding:0;margin:0 0 32px;max-width:520px;display:flex;flex-direction:column;gap:14px;}
.expertise-list li{position:relative;padding:14px 16px 14px 20px;background:var(--paper);border-radius:6px;border-left:3px solid var(--red);font-size:13.5px;line-height:1.7;color:var(--muted);transition:border-color .2s,transform .25s;}
.expertise-list li:hover{border-left-color:var(--gold);transform:translateX(3px)}
.expertise-list li strong{display:block;font-family:var(--sans);font-weight:600;color:var(--ink);font-size:13px;letter-spacing:.3px;margin-bottom:4px;}
.hero-stats{display:flex;gap:44px;margin-bottom:40px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-n{font-family:var(--display);font-size:50px;color:var(--ink);line-height:1}
.stat-n sup{font-size:18px;color:var(--red)}
.stat-l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.pill-row{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid var(--border);border-radius:100px;font-family:var(--mono);font-size:11px;color:var(--ink);text-decoration:none;background:white;transition:all .2s}
.pill:hover{border-color:var(--red);color:var(--red)}
.pill svg{flex-shrink:0}

.exp-list{display:flex;flex-direction:column}
.exp-item{display:grid;grid-template-columns:155px 1fr;gap:36px;padding:32px 0;border-bottom:1px solid var(--border)}
.exp-item:last-child{border-bottom:none}
.exp-period{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:7px}
.exp-co{font-size:12px;font-weight:500;color:var(--ink);line-height:1.4}
.exp-badge{display:inline-block;margin-top:7px;padding:2px 9px;background:var(--cream);border-radius:100px;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.exp-content h3{font-family:var(--display);font-size:26px;letter-spacing:1px;color:var(--ink);margin-bottom:12px;line-height:1.1}
.exp-bullets{list-style:none;display:flex;flex-direction:column;gap:6px}
.exp-bullets li{font-size:13px;color:var(--muted);padding-left:16px;position:relative;line-height:1.65}
.exp-bullets li::before{content:'→';position:absolute;left:0;color:var(--red);font-size:11px;top:2px}

.skills-bg{background:var(--ink);border-radius:6px;padding:48px 52px;margin:0 -4px}
.skills-bg .sec-label{color:var(--red)}
.skills-bg h2.sec-title{color:var(--paper);margin-bottom:36px}
.skills-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:48px}
.skill-group{margin-bottom:8px}
.skill-group h4{font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid rgba(245,240,232,.1);}
.skill-row{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.skill-name{font-size:13px;color:rgba(245,240,232,.85);min-width:140px;flex-shrink:0}
.skill-track{flex:1;height:6px;background:rgba(245,240,232,.1);border-radius:100px;overflow:hidden;}
.skill-fill{height:100%;background:var(--red);border-radius:100px;width:0%;transition:width 1s cubic-bezier(.16,1,.3,1);}
.skill-lv{font-family:var(--mono);font-size:11px;font-weight:500;color:rgba(245,240,232,.75);white-space:nowrap;min-width:76px;text-align:right;letter-spacing:.5px;}
.badges-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.badge{padding:5px 13px;border:1px solid rgba(245,240,232,.12);border-radius:3px;font-family:var(--mono);font-size:9px;color:rgba(245,240,232,.45);letter-spacing:1px;transition:all .2s;cursor:default}
.badge:hover{border-color:var(--red);color:var(--paper)}
.badge.hot{border-color:var(--gold);color:var(--gold)}

.edu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:40px}
.edu-card{padding:28px;border:1px solid var(--border);border-radius:2px;background:white;position:relative;overflow:hidden;transition:border-color .2s}
.edu-card:hover{border-color:var(--red)}
.edu-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--red)}
.edu-yr{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.edu-deg{font-family:var(--display);font-size:21px;letter-spacing:1px;color:var(--ink);line-height:1.2;margin-bottom:7px}
.edu-school{font-size:12px;color:var(--muted);margin-bottom:12px}
.edu-gpa{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;background:var(--cream);border-radius:100px;font-family:var(--mono);font-size:11px;color:var(--ink)}
.edu-gpa strong{color:var(--red)}

.hobby-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hcard{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid var(--border);border-radius:2px;background:white;cursor:default;transition:all .25s}
.hcard:hover{background:var(--ink);border-color:var(--ink)}
.hcard:hover .hlabel{color:var(--paper)}
.hicon{font-size:26px;opacity:.68}
.hlabel{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-family:var(--mono);transition:color .25s}

#page-portfolio{background:var(--cream)}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.fbtn,.gbtn{padding:7px 16px;border:1px solid var(--border);border-radius:100px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:white;cursor:pointer;transition:all .2s;white-space:nowrap;}
.fbtn:hover,.fbtn.on,.gbtn:hover,.gbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.masonry{columns:3;column-gap:11px}
.mitem{break-inside:avoid;margin-bottom:11px;position:relative;overflow:hidden;border-radius:4px;cursor:pointer;border:1px solid var(--border);transition:transform .25s,opacity .3s,filter .3s}
.mitem:hover{transform:scale(1.015)}
.mitem img{width:100%;display:block;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.mitem:hover img{transform:scale(1.05)}
.mitem .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,13,13,.75) 0%,transparent 55%);opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;padding:12px}
.mitem:hover .ov{opacity:1}
.ov span{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:white}

#page-videos{background:white}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.vcard{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--paper);transition:border-color .25s,transform .25s,box-shadow .25s}
.vcard:hover{border-color:var(--ink);transform:translateY(-4px);box-shadow:0 12px 28px rgba(13,13,13,.1)}
.vthumb{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden}
.vthumb iframe{width:100%;height:100%;border:none;display:block}
.vplay-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,13,13,.3);cursor:pointer;transition:background .2s;z-index:2;}
.vplay-overlay:hover{background:rgba(13,13,13,.1)}
.vplay-overlay.hidden{display:none}
.vplay-btn{width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(233,64,64,.5);transition:transform .2s;}
.vplay-overlay:hover .vplay-btn{transform:scale(1.1)}
.vnum{position:absolute;top:10px;left:10px;z-index:3;background:rgba(13,13,13,.7);color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;}
.vinfo{padding:14px 16px 16px}
.vtag{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.vinfo h4{font-family:var(--display);font-size:18px;letter-spacing:1px;color:var(--ink);margin-bottom:3px;line-height:1.2}
.vinfo p{font-size:11px;color:var(--muted);line-height:1.6}

.lb{position:fixed;inset:0;background:rgba(13,13,13,.93);z-index:8000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.on{opacity:1;pointer-events:all}
.lb img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:2px}
.lb-close{position:absolute;top:20px;right:26px;font-family:var(--mono);font-size:20px;color:rgba(245,240,232,.45);cursor:pointer;background:none;border:none;line-height:1;transition:color .2s;z-index:8001}
.lb-close:hover{color:var(--paper)}
.lb-cap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:2px;color:rgba(245,240,232,.32);text-transform:uppercase;white-space:nowrap}

/* กลับไปใช้ CSS Original ของคุณทั้งหมดในส่วนหน้า Website */
#page-websites{background:var(--paper)}
.web-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.web-card{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bgCard,white);transition:border-color .25s,transform .25s,box-shadow .25s;text-decoration:none;display:block;}
.web-card:hover{border-color:var(--ink);transform:translateY(-4px);box-shadow:0 12px 32px rgba(13,13,13,.1);}
.web-preview{position:relative;aspect-ratio:16/9;background:var(--cream);overflow:hidden;}
.web-preview iframe{width:200%;height:200%;border:none;display:block;transform:scale(.5);transform-origin:top left;pointer-events:none;}
.web-preview-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--cream);opacity:0;transition:opacity .3s;pointer-events:none;}
.web-preview iframe.blocked + .web-preview-overlay + .web-preview-fallback,
.web-preview-fallback.show{opacity:1}
.web-preview-fallback-icon{font-size:32px;opacity:.4}
.web-preview-fallback-text{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.web-preview-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,13,13,0);transition:background .25s;}
.web-card:hover .web-preview-overlay{background:rgba(13,13,13,.08)}
.web-visit-btn{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;background:var(--ink);color:var(--paper);padding:8px 20px;border-radius:100px;font-family:var(--mono);font-size:10px;letter-spacing:2px;}
.web-card:hover .web-visit-btn{opacity:1;transform:none}
.web-info{padding:18px 20px 20px;border-top:1px solid var(--border)}
.web-tag{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:5px;}
.web-name{font-family:var(--display);font-size:22px;letter-spacing:1px;color:var(--ink);margin-bottom:5px;line-height:1.2;}
.web-desc{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:12px}
.web-url{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);transition:color .2s;}
.web-card:hover .web-url{color:var(--red)}
.web-role{display:inline-block;margin-top:8px;padding:3px 10px;background:var(--cream);border-radius:100px;font-size:10px;color:var(--muted);}

.portfolio-section{margin-bottom:60px}
.section-divider-label{display:flex;align-items:center;gap:14px;padding:22px 0 18px;border-top:2px solid var(--ink);margin:0 0 24px;position:sticky;top:0;background:var(--paper);z-index:5;}
.section-icon{font-size:28px;line-height:1}
.section-title-text{font-family:var(--display);font-size:32px;letter-spacing:2px;color:var(--ink);line-height:1;}
.section-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;letter-spacing:1px;}

.disc-wrap{background:var(--ink);border-radius:8px;padding:40px 44px;position:relative;overflow:hidden}
.disc-wrap::before{content:'DISC';position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:120px;color:rgba(255,255,255,.03);letter-spacing:8px;pointer-events:none;line-height:1}
.disc-top{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:28px}
.disc-badge-label{font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(245,240,232,.35);margin-bottom:8px}
.disc-type-name{font-family:var(--display);font-size:44px;letter-spacing:2px;color:var(--red);line-height:1;margin-bottom:4px}
.disc-type-th{font-size:17px;font-weight:600;color:rgba(245,240,232,.7);margin-bottom:12px}
.disc-desc{font-size:12px;color:rgba(245,240,232,.55);line-height:1.8}
.disc-bars{display:flex;flex-direction:column;gap:16px;justify-content:center}
.disc-bar-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.disc-bar-name{font-size:12px;font-weight:500;color:rgba(245,240,232,.8)}
.disc-bar-score{font-family:var(--display);font-size:24px;line-height:1}
.disc-track{height:7px;background:rgba(245,240,232,.1);border-radius:100px;overflow:hidden}
.disc-fill{height:100%;border-radius:100px;width:0%;transition:width 1.2s cubic-bezier(.16,1,.3,1)}
.disc-source{margin-top:20px;padding-top:14px;border-top:1px solid rgba(245,240,232,.08);display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;color:rgba(245,240,232,.28);letter-spacing:1px;flex-wrap:wrap}
.disc-source a{color:rgba(245,240,232,.45);text-decoration:none;transition:color .2s}

@media(max-width:960px){
  .topbar{display:flex}
  .sidenav{transform:translateX(-100%);padding-top:calc(var(--topbar-h) + 16px)}
  .sidenav.open{transform:translateX(0)}
  .exp-item{grid-template-columns:1fr;gap:8px}
  .skills-cols{grid-template-columns:1fr;gap:32px}
  .skills-bg{padding:28px 18px;margin:0}
  .edu-grid{grid-template-columns:1fr}
  .hobby-row{grid-template-columns:repeat(2,1fr)}

</div><div class="lb" id="lb" onclick="if(event.target===this)closeLb()">

<script>
// ── LANGUAGE ──
let lang = 'th';
function setLang(l) {
  lang = l;
  document.getElementById('btn-th').classList.toggle('on', l === 'th');
  document.getElementById('btn-en').classList.toggle('on', l === 'en');
  renderLang();
}
function renderLang() {
  document.querySelectorAll('[data-th],[data-en]').forEach(el => {
    if (el.classList.contains('skill-name') && !el.getAttribute('data-' + lang)) return;
    const txt = el.getAttribute('data-' + lang);
    if (txt === null) return;
    el.innerHTML = txt;
  });
}
renderLang();

// ── PAGE ROUTING ──
const pages = {};
document.querySelectorAll('.page').forEach(p => pages[p.id] = p);
let current = 'page-home';
let busy = false;

function goTo(id) {
  const target = 'page-' + id;
  if (target === current || busy || !pages[target]) return;
  busy = true;
  const fromPage = pages[current];
  const toPage   = pages[target];

  fromPage.classList.add('exit');
  setTimeout(() => {
    fromPage.classList.remove('active', 'exit');
    toPage.classList.add('active');
    toPage.scrollTop = 0;
    current = target;
    busy = false;
  }, 360);

  document.querySelectorAll('.nav-links a[data-page]').forEach(a =>
    a.classList.toggle('active', a.dataset.page === id));
  closeNav();
  history.pushState(null,'','#'+id);
}

document.querySelectorAll('.nav-links a[data-page]').forEach(a =>
  a.addEventListener('click', e => { e.preventDefault(); goTo(a.dataset.page); }));

// ── BURGER & BACKDROP ──
const burger = document.getElementById('burger');
const sidenav = document.getElementById('sidenav');
const backdrop = document.getElementById('navBackdrop');

function openNav() { sidenav.classList.add('open'); burger.classList.add('open'); backdrop.classList.add('show'); }
function closeNav() { sidenav.classList.remove('open'); burger.classList.remove('open'); backdrop.classList.remove('show'); }

let burgerTouched = false;
burger.addEventListener('touchend', function(e) {
  e.preventDefault(); burgerTouched = true;
  sidenav.classList.contains('open') ? closeNav() : openNav();
  setTimeout(() => { burgerTouched = false; }, 400);
}, { passive: false });
burger.addEventListener('click', function(e) {
  if (burgerTouched) return;
  sidenav.classList.contains('open') ? closeNav() : openNav();
});
backdrop.addEventListener('click', closeNav);
backdrop.addEventListener('touchend', function(e) { e.preventDefault(); closeNav(); }, { passive: false });

// ── BARS ANIMATION ──
(function(){
  const skillsBg = document.getElementById('skillsBg');
  if(skillsBg){
    let fired = false;
    const check = () => {
      if(fired) return;
      const rect = skillsBg.getBoundingClientRect();
      if(rect.top < window.innerHeight){
        fired = true;
        document.querySelectorAll('.skill-fill').forEach((bar, i) => {
          setTimeout(() => {
            bar.style.transition = 'width 1s';
            bar.style.width = (bar.getAttribute('data-w') || '0') + '%';
          }, i * 60 + 100);
        });
      }
    };
    setTimeout(check, 500);
    document.getElementById('page-home').addEventListener('scroll', check, { passive: true });
  }
})();

// ── VIDEO PLAY ──
function playVid(overlay) {
  const iframe = overlay.previousElementSibling;
  if (iframe && iframe.dataset.src) { iframe.src = iframe.dataset.src; }
  overlay.classList.add('hidden');
}

// ── COUNT BADGES ──
(function(){
  const photoCount = document.getElementById('photoCount');
  const graphicCount = document.getElementById('graphicCount');
  if (photoCount) {
    const n = document.querySelectorAll('#masonry .mitem').length;
    photoCount.textContent = n + ' WORKS';
  }
  if (graphicCount) {
    const n = document.querySelectorAll('#graphicMasonry .mitem').length;
    graphicCount.textContent = n + ' WORKS';
  }
})();

// ── FILTERS ──
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const f = btn.dataset.f;
    document.querySelectorAll('#masonry .mitem').forEach(item => {
      const match = f === 'all' || item.dataset.cat === f;
      item.style.opacity = match ? '1' : '0.13';
      item.style.filter = match ? '' : 'grayscale(1)';
      item.style.pointerEvents = match ? 'all' : 'none';
    });
  });
});

// ── LIGHTBOX ──
function openLightbox(img, caption) {
  if (!img) return;
  document.getElementById('lbImg').src = img.src;
  document.getElementById('lbCap').textContent = caption || '';
  document.getElementById('lb').classList.add('on');
}
document.querySelectorAll('.mitem').forEach(item => {
  item.addEventListener('click', () => {
    const img = item.querySelector('img');
    const cap = item.querySelector('.ov span');
    openLightbox(img, cap ? cap.getAttribute('data-'+lang) || cap.textContent : '');
  });
});
function closeLb() { document.getElementById('lb').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeLb(); });

// ── WEBSITE IFRAME FALLBACK (ใช้โค้ด Original ของคุณเป๊ะๆ) ──
document.querySelectorAll('.web-preview iframe').forEach(iframe => {
  iframe.addEventListener('error', () => {
    const fb = iframe.closest('.web-preview').querySelector('.web-preview-fallback');
    if (fb) fb.classList.add('show');
  });
  // timeout fallback — ถ้า 3 วินาทีแล้วยัง blank ให้แสดง fallback
  setTimeout(() => {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc || doc.body === null || doc.body.innerHTML === '') {
        const fb = iframe.closest('.web-preview').querySelector('.web-preview-fallback');
        if (fb) fb.classList.add('show');
      }
    } catch(e) {
      // cross-origin blocked = iframe is actually loading fine, don't show fallback
    }
  }, 3000);
});
</script>
